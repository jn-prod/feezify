name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site build embeds the repo documentation (/docs, EN + FR).
      - name: Copy /docs into the site source
        run: |
          rsync -a --delete docs/ site/docs/
          cd site && sh scripts/prepare-docs.sh

      # Social crawlers don't render SVG — produce the OG card as PNG.
      - name: Generate the OpenGraph image
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin
          rsvg-convert -w 1200 -h 630 site/assets/og.svg -o site/assets/og.png

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Build with Jekyll
        run: bundle exec jekyll build --source . --destination _site
        working-directory: site
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
